name: Update Repo Descriptions

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-descriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update repo descriptions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ADMIN_PAT: ${{ secrets.REPO_ADMIN_PAT }}
          ORG_NAME: ${{ vars.ORG_NAME }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python scripts/update-repo-descriptions.py
